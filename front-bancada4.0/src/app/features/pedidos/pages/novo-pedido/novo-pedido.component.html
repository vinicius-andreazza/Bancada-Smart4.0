<div class="min-h-screen flex flex-col bg-gray-50 dark:bg-gray-950">

  <app-navbar />

  <main class="flex-1 w-full max-w-5xl mx-auto px-4 py-8 flex flex-col gap-6">

    <h1 class="text-2xl font-semibold text-gray-900 dark:text-gray-100">
      Novo pedido
    </h1>

    <div>
      @if (saveSuccess()) {
        <app-toast-notifications [text]="'Pedido criado com sucesso!'" [variant]="'success'"></app-toast-notifications>
      }
      @if (saveError()) {
        <app-toast-notifications [text]="'Houve um erro na criação do pedido'" [variant]="'error'"></app-toast-notifications>
      }
      @if (isSaving()) {
        <app-toast-notifications [text]="'Pedido enviado...'" [variant]="'info'"></app-toast-notifications>
      }
    </div>

    <form id="pedidoForm" [formGroup]="pedidoForm" (ngSubmit)="enviarPedido()" class="flex flex-col gap-6">

      <app-pedido-card [form]="pedidoForm" />

      <div class="flex items-center gap-3">
        <app-button [variant]="'primary'" [size]="'md'" [type]="'button'" (click)="gerarJson()">
          Gerar JSON
        </app-button>
        <app-button [variant]="'primary'" [size]="'md'" [type]="'submit'" >
          Enviar pedido
        </app-button>
      </div>

    </form>

    @if (jsonOutput()) {
      <pre class="rounded-lg border border-gray-200 dark:border-gray-700
                  bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200
                  text-sm p-4 overflow-x-auto">{{ jsonOutput() }}</pre>
    }

  </main>

  <app-footer />

</div>
