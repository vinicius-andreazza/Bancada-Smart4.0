<div class="min-h-screen flex flex-col bg-gray-950 text-gray-100">

  <app-navbar />

  <div class="flex-1 px-4 py-6 md:px-8 md:py-10">
    <main class="max-w-screen-xl mx-auto flex flex-col gap-6">

      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <app-status-card-pedido [type]="'TOTAL'" [total]="totalPedidos()" />
        <app-status-card-pedido [type]="StatusPedido.PENDENTE" [total]="qtdPendentes()" />
        <app-status-card-pedido [type]="StatusPedido.PRODUCAO" [total]="qtdProducao()" />
        <app-status-card-pedido [type]="StatusPedido.CONCLUIDO" [total]="qtdConcluidos()" />
      </div>

      <div class="rounded-xl border border-gray-800 bg-gray-900 shadow-sm">

        <div class="flex flex-wrap items-center gap-3 px-5 py-4 border-b border-gray-800">

          <div class="flex items-center gap-2 text-sm font-semibold text-gray-100 tracking-wide">
            <i class="fa-solid fa-table-list text-indigo-400 text-base" aria-hidden="true"></i>
            Lista de Pedidos
          </div>

          <div class="flex items-center gap-1 flex-wrap">
            <app-button [type]="'button'" [size]="'md'"
              [variant]="filtroAtual()=='TODOS' ? 'secondary' : 'ghost'"
              (click)="setFiltro('TODOS')">Todos</app-button>

            <app-button [type]="'button'" [size]="'md'"
              [variant]="filtroAtual()=='PENDENTE' ? 'secondary' : 'ghost'"
              (click)="setFiltro('PENDENTE')">Pendente</app-button>

            <app-button [type]="'button'" [size]="'md'"
              [variant]="filtroAtual()=='PRODUCAO' ? 'secondary' : 'ghost'"
              (click)="setFiltro('PRODUCAO')">Produção</app-button>

            <app-button [type]="'button'" [size]="'md'"
              [variant]="filtroAtual()=='CONCLUIDO' ? 'secondary' : 'ghost'"
              (click)="setFiltro('CONCLUIDO')">Concluído</app-button>
          </div>

          <div class="ml-auto w-full sm:w-56">
            <app-input-field id="busca" label="" [control]="buscaControl" />
          </div>

        </div>

        <div class="overflow-x-auto">
          <app-pedido-table
            [pedidos]="pedidosFiltrados()"
            (verDetalhe)="abrirDetalhe($event)"
            (excluir)="abrirConfirmacaoExclusao($event)" />
        </div>

      </div>

    </main>
  </div>

  <app-footer />

</div>

@if (pedidoSelecionado()) {
  <app-pedido-detalhe-modal
    [pedido]="pedidoSelecionado()!"
    (fechar)="fecharDetalhe()"
    (enviarProducao)="onEnviarProducao($event)"
    (retirar)="onRetirar($event)"
  />
}

@if (pedidoProducao()) {
  <app-modal
    [hasFooter]="true"
    maxWidth="sm"
    (fechar)="cancelarEnvioProducao()"
  >

    <div slot="header">
      <h2 class="text-lg font-semibold text-gray-100">
        Enviar para produção
      </h2>
    </div>

    <div slot="body" class="p-6">
      <p class="text-sm text-gray-400 mb-4">
        Informe o IP do CLP para enviar o pedido
        <strong>{{ pedidoProducao()?.codPedido }}</strong>.
      </p>

      <app-input-field
        id="ipClp"
        label="IP do CLP"
        placeholder="Ex: 192.168.0.100"
        [control]="ipClpControl"
      />
    </div>

    <div slot="footer">
      <app-button
      [type]="'button'"
        [size]="'md'"
        [variant]="'danger'"
        (click)="cancelarEnvioProducao()"
      >Cancelar</app-button>

      <app-button
      [type]="'button'"
      [size]="'md'"
      [variant]="'secondary'"
        (click)="confirmarEnvioProducao()"
      >Enviar</app-button>
    </div>

  </app-modal>
}
