<article class="rounded-xl border border-gray-800 bg-gray-900 p-4 flex flex-col gap-3">

  <!-- Cabeçalho: ID + status -->
  <div class="flex items-center justify-between gap-3">
    <span class="font-mono text-sm text-gray-400">#{{ pedido().id }}</span>
    <span [class]="statusBadgeClass[pedido().status]">
      {{ statusLabel[pedido().status] }}
    </span>
  </div>

  <!-- Ordem de produção -->
  <div class="flex items-baseline justify-between gap-3">
    <span class="font-mono text-[0.6rem] uppercase tracking-wider text-gray-500">
      Ordem de Produção
    </span>
    <span class="text-base font-semibold text-gray-100">{{ pedido().codPedido }}</span>
  </div>

  <!-- Detalhes -->
  <dl class="grid grid-cols-2 gap-x-4 gap-y-2 text-sm border-t border-gray-800/60 pt-3">
    <div class="flex flex-col gap-0.5">
      <dt class="font-mono text-[0.6rem] uppercase tracking-wider text-gray-500">Tipo</dt>
      <dd class="text-gray-300">{{ tipoLabel[pedido().tipoPedido] }}</dd>
    </div>

    <div class="flex flex-col gap-0.5">
      <dt class="font-mono text-[0.6rem] uppercase tracking-wider text-gray-500">Tampa</dt>
      <dd class="flex items-center gap-2 text-gray-300">
        <span
          [class]="tampaCssClass[pedido().corTampa] + ' w-3.5 h-3.5 rounded-sm flex-shrink-0'"
        ></span>
        {{ tampaLabel[pedido().corTampa] }}
      </dd>
    </div>

    <div class="flex flex-col gap-0.5">
      <dt class="font-mono text-[0.6rem] uppercase tracking-wider text-gray-500">Blocos</dt>
      <dd class="font-mono text-gray-300">{{ totalBlocos() }}</dd>
    </div>

    <div class="flex flex-col gap-0.5">
      <dt class="font-mono text-[0.6rem] uppercase tracking-wider text-gray-500">Data</dt>
      <dd class="font-mono text-xs text-gray-400">{{ pedido().dataCriacao }}</dd>
    </div>
  </dl>

  <!-- Ações -->
  <div class="flex items-center justify-end gap-2 border-t border-gray-800/60 pt-3">
    <app-button
      [variant]="'primary'"
      [size]="'md'"
      [type]="'button'"
      aria-label="Ver detalhes do pedido"
      (click)="verDetalhe.emit(pedido())"
    >
      <i class="fa-solid fa-eye" aria-hidden="true"></i>
      Detalhes
    </app-button>

    <app-button
      [variant]="'danger'"
      [size]="'md'"
      [type]="'button'"
      aria-label="Excluir pedido"
      (click)="excluir.emit(pedido().id)"
    >
      <i class="fa-solid fa-trash" aria-hidden="true"></i>
    </app-button>
  </div>

</article>
