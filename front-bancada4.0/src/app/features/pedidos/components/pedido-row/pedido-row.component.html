<td class="px-4 py-3 align-middle text-sm text-gray-400 font-mono">
  #{{ pedido().id }}
</td>

<td class="px-4 py-3 align-middle text-sm text-gray-200 font-medium">
  {{ pedido().codPedido }}
</td>

<td class="px-4 py-3 align-middle">
  <span [class]="tipoBadgeClass[pedido().tipoPedido]">
    <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
    {{ tipoLabel[pedido().tipoPedido] }}
  </span>
</td>

<td class="px-4 py-3 align-middle">
  <div class="flex items-center gap-2">
    @if (corTampa(); as cor) {
      <span [class]="tampaCssClass[cor] + ' w-3.5 h-3.5 rounded-sm flex-shrink-0'"></span>
    }
    <span class="text-sm text-gray-400">{{ corTampaLabel() }}</span>
  </div>
</td>

<td class="px-4 py-3 align-middle">
  <span [class]="statusBadgeClass[pedido().status]">
    <i [class]="statusIcon[pedido().status]" aria-hidden="true"></i>
    {{ statusLabel[pedido().status] }}
  </span>
</td>

<td class="px-4 py-3 align-middle text-xs text-gray-400 whitespace-nowrap">
  <span class="inline-flex items-center gap-1.5">
    <i class="fa-solid fa-calendar-plus text-gray-600" aria-hidden="true"></i>
    <span class="font-mono">{{ criacaoFmt() }}</span>
  </span>
</td>

<td class="px-4 py-3 align-middle text-xs whitespace-nowrap">
  @if (duracao(); as d) {
    <span class="inline-flex items-center gap-1.5 text-gray-300">
      <i class="fa-solid fa-stopwatch text-emerald-400" aria-hidden="true"></i>
      <span class="font-mono">{{ d }}</span>
    </span>
  } @else if (emProducao()) {
    <span class="inline-flex items-center gap-1.5 text-blue-400">
      <i class="fa-solid fa-spinner text-blue-400" aria-hidden="true"></i>
      Em andamento
    </span>
  } @else {
    <span class="text-gray-600">—</span>
  }
</td>

<td class="px-4 py-3 align-middle text-xs text-gray-400 whitespace-nowrap">
  <span class="inline-flex items-center gap-1.5">
    <i class="fa-solid fa-flag-checkered text-gray-600" aria-hidden="true"></i>
    <span class="font-mono">{{ conclusaoFmt() }}</span>
  </span>
</td>

<td class="px-4 py-3 align-middle text-right">
  <div class="flex items-center justify-end gap-1">
    <app-button
      [variant]="'primary'"
      [size]="'md'"
      [type]="'button'"
      aria-label="Ver detalhes do pedido"
      (click)="verDetalhe()"
    >
      <i class="fa-solid fa-eye" aria-hidden="true"></i>
    </app-button>
    <app-button
      [variant]="'danger'"
      [size]="'md'"
      [type]="'button'"
      aria-label="Excluir pedido"
      (click)="excluir()"
    >
      <i class="fa-solid fa-trash" aria-hidden="true"></i>
    </app-button>
  </div>
</td>
