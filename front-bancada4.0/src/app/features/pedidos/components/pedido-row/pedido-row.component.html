<td class="px-4 py-3 align-middle text-sm text-gray-400 font-mono">
  #{{ pedido().id }}
</td>

<td class="px-4 py-3 align-middle text-sm text-gray-200 font-medium">
  {{ pedido().codPedido }}
</td>

<td class="px-4 py-3 align-middle text-sm text-gray-400">
  {{ tipoLabel[pedido().tipoPedido] }}
</td>

<td class="px-4 py-3 align-middle">
  <div class="flex items-center gap-2">
    <span
      [class]="tampaCssClass[pedido().corTampa] + ' w-3.5 h-3.5 rounded-sm flex-shrink-0'"
    ></span>
    <span class="text-sm text-gray-400">
      {{ tampaLabel[pedido().corTampa] }}
    </span>
  </div>
</td>

<td class="px-4 py-3 align-middle text-sm text-gray-400 font-mono">
  {{ totalBlocos() }}
</td>

<td class="px-4 py-3 align-middle">
  <span [class]="statusBadgeClass[pedido().status]">
    {{ statusLabel[pedido().status] }}
  </span>
</td>

<td class="px-4 py-3 align-middle text-xs text-gray-500 font-mono whitespace-nowrap">
  {{ pedido().dataCriacao }}
</td>

<td class="px-4 py-3 align-middle text-right">
  <div class="flex items-center justify-end gap-1">
    <app-button
      [variant]="'primary'"
      [size]="'md'"
      [type]="'button'"
      aria-label="Ver detalhes do pedido"
      (click)="verDetalhe()"
    >
      <i class="fa-solid fa-eye" aria-hidden="true"></i>
    </app-button>
    <app-button
      [variant]="'danger'"
      [size]="'md'"
      [type]="'button'"
      aria-label="Excluir pedido"
      (click)="excluir()"
    >
      <i class="fa-solid fa-trash" aria-hidden="true"></i>
    </app-button>
  </div>
</td>
