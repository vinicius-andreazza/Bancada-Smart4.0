<div class="grid grid-cols-1 sm:grid-cols-3 gap-4" [formGroup]="form()">

  <div class="flex flex-col gap-1.5">
    <label for="corLamina" class="text-sm font-medium text-gray-600 dark:text-gray-400">
      Cor da lâmina
    </label>
    <select id="corLamina" formControlName="corLamina"
      class="w-full rounded-lg border border-gray-200 dark:border-gray-700
             bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100
             px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500
             transition-all duration-200">
      <option value="1">Vermelho</option>
      <option value="2">Azul</option>
      <option value="3">Amarelo</option>
      <option value="4">Verde</option>
      <option value="5">Preto</option>
      <option value="6">Branco</option>
    </select>
  </div>

  <div class="flex flex-col gap-1.5">
    <label for="padraoLamina" class="text-sm font-medium text-gray-600 dark:text-gray-400">
      Padrão
    </label>
    <select id="padraoLamina" formControlName="padraoLamina"
      class="w-full rounded-lg border border-gray-200 dark:border-gray-700
             bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100
             px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500
             transition-all duration-200">
      <option value="0">Nenhum</option>
      <option value="1">Casa</option>
      <option value="2">Navio</option>
      <option value="3">Estrela</option>
    </select>
  </div>

  <div class="flex flex-col gap-1.5">
    <label for="posicaoLamina" class="text-sm font-medium text-gray-600 dark:text-gray-400">
      Posição
    </label>
    <select id="posicaoLamina" formControlName="posicaoLamina"
      class="w-full rounded-lg border border-gray-200 dark:border-gray-700
             bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100
             px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500
             transition-all duration-200">
      <option value="1">Esquerda</option>
      <option value="2">Frente</option>
      <option value="3">Direita</option>
    </select>
  </div>

</div>
