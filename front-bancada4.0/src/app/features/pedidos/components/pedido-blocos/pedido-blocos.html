<div class="flex flex-col gap-6" [formGroup]="form()">

  <div class="flex flex-col gap-4">
    <div class="flex items-center gap-2">
      <h3 class="text-lg font-semibold text-gray-900 dark:text-gray-100">Bloco</h3>
      <span class="rounded-md bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300
                   text-sm font-semibold px-2.5 py-0.5">
        Andar {{ andar() }}
      </span>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="flex flex-col gap-1.5">
        <label for="corBloco" class="text-sm font-medium text-gray-600 dark:text-gray-400">
          Cor do bloco
        </label>
        <select id="corBloco" formControlName="corBloco"
          class="w-full rounded-lg border border-gray-200 dark:border-gray-700
                 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100
                 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500
                 transition-all duration-200">
          <option value="1">Preto</option>
          <option value="2">Vermelho</option>
          <option value="3">Azul</option>
        </select>
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="posEstoque" class="text-sm font-medium text-gray-600 dark:text-gray-400">
          Posição estoque
        </label>
        <input id="posEstoque" type="text" formControlName="posEstoque"
          class="w-full rounded-lg border border-gray-200 dark:border-gray-700
                 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100
                 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500
                 transition-all duration-200" />
      </div>
    </div>
  </div>

  <div class="flex flex-col gap-3" formArrayName="laminas">
    @for (lamina of laminas.controls; track $index) {
      <app-pedido-laminas [form]="$any(lamina)" />
    }
  </div>

  <div class="flex items-center gap-3">
    @if (laminas.length > 0) {
      <app-button [variant]="'danger'" [size]="'sm'" [type]="'button'" (click)="removerLamina()">
        Remover
      </app-button>
    }
    <app-button [variant]="'primary'" [size]="'md'" [type]="'button'" (click)="addLamina()">
      Adicionar lâmina
    </app-button>
  </div>

</div>
