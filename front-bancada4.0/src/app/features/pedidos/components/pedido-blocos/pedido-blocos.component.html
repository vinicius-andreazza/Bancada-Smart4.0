<div class="flex flex-col gap-6" [formGroup]="form()">

  <div class="flex flex-col gap-4">
    <app-section-header title="Bloco" [badge]="'Andar ' + form().get('andar')?.value" />

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <app-select-field id="corBloco" label="Cor do bloco" [control]="form().get('corBloco')!">
        <option value="1">Preto</option>
        <option value="2">Vermelho</option>
        <option value="3">Azul</option>
      </app-select-field>
    </div>
  </div>

  <div class="flex flex-col gap-3" formArrayName="laminas">
    @for (lamina of laminas.controls; track $index) {
      <app-pedido-laminas [form]="$any(lamina)" />
    }
  </div>

  <div class="flex items-center gap-3">
    @if (laminas.length > 0) {
      <app-button [variant]="'danger'" [size]="'sm'" [type]="'button'" (click)="removerLamina()">
        Remover
      </app-button>
    }
    <app-button [variant]="'primary'" [size]="'md'" [type]="'button'" (click)="addLamina()">
      Adicionar lâmina
    </app-button>
  </div>

</div>
