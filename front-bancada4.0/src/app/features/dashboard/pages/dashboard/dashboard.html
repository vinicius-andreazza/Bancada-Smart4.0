<div class="app-shell">

    <main class="main-content">

        <div class="page-header">

            <app-navbar>

            </app-navbar>

        </div>

        <div class="dual-panel">

            <app-estoque-panel
                [positions]="estoquePositions()"
                (refresh)="refreshEstoque()"
                (cellClick)="openCellDetail($event)">
            </app-estoque-panel>

            <app-expedicao-panel
                [positions]="expedicaoPositions()"
                (refresh)="refreshExpedicao()">
            </app-expedicao-panel>

        </div>

    </main>

</div>

<app-cell-detail-model
    [opened]="modalOpen()"
    [position]="selectedPosition()"
    (close)="closeCellModal()">
</app-cell-detail-model>
