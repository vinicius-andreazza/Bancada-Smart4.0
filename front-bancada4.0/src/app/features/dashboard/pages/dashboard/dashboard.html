
<div class="app-shell">
    <app-navbar></app-navbar>
    <main class="main-content">

        <div class="page-header">

            
            <app-refresh-timer [seconds]=5>

            </app-refresh-timer>

        </div>

        <div class="dual-panel">

            <app-estoque-panel
                [positions]="estoquePositions()"
                (refresh)="refreshEstoque()"
                (cellClick)="openCellDetail($event)">
            </app-estoque-panel>

            <app-expedicao-panel
                [positions]="expedicaoPositions()"
                (refresh)="refreshExpedicao()">
            </app-expedicao-panel>

        </div>
        
    </main>
    <app-footer></app-footer>
</div>



<app-cell-detail-model
    [opened]="modalOpen()"
    [position]="selectedPosition()"
    (close)="closeCellModal()">
</app-cell-detail-model>
