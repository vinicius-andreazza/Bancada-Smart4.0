<div class="app-shell">

    <main class="main-content">

        <div class="page-header">

            <div>

                <h1 class="page-title">
                    Estoque & Expedição
                </h1>

                <p class="page-subtitle">
                    Monitoramento em Tempo Real · Planta SMART 4.0
                </p>

            </div>

            <div class="page-actions">

                <app-refresh-timer
                    [seconds]="refreshCountdown()">
                </app-refresh-timer>

                <button
                    class="btn-smart btn-primary"
                    >

                    Novo Pedido

                </button>

            </div>

        </div>

        <div class="dual-panel">

            <app-estoque-panel
                [positions]="estoquePositions()"
                (refresh)="refreshEstoque()"
                (cellClick)="openCellDetail($event)">
            </app-estoque-panel>

            <app-expedicao-panel
                [positions]="expedicaoPositions()"
                (refresh)="refreshExpedicao()">
            </app-expedicao-panel>

        </div>

    </main>

</div>

<app-cell-detail-model
    [opened]="modalOpen()"
    [position]="selectedPosition()"
    (close)="closeCellModal()">
</app-cell-detail-model>
