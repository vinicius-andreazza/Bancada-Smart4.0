
<div class="flex flex-col min-h-screen">
 
  <app-navbar></app-navbar>
 
  <main class="flex-1 w-full px-4 sm:px-6 lg:px-8 py-6">
 
    <div class="flex items-start justify-between flex-wrap gap-4 mb-6">
      <div class="flex items-center gap-3">
        <app-refresh-timer [seconds]="refreshCountdown()"></app-refresh-timer>
      </div>
    </div>
 
    @if (saveSuccess()) {
      <app-toast-notifications [text]="'Estoque atualizado com sucesso!'" [variant]="'success'"></app-toast-notifications>
    }
 
    @if (saveError()) {
      <app-toast-notifications [text]="'Erro ao salvar'" [variant]="'error'"></app-toast-notifications>
    }
 
    @if (isSaving()) {
      <app-toast-notifications [text]="'Salvando alterações...'" [variant]="'info'"></app-toast-notifications>
    }
 
    <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_minmax(0,0.8fr)] gap-6 lg:gap-10 items-start">
 
      <app-estoque-panel
        [positions]="estoquePositions()"
        [editMode]="editMode()"
        [selectedColor]="selectedColor()"
        [pendingChanges]="pendingChanges()"
        [cellColorMap]="cellColorMap()"
        (cellClick)="openCellDetail($event)"
        (applyColor)="applyColorToCell($event)"
        (enterEditMode)="enterEditMode()"
        (selectColor)="selectColor($event)"
        (save)="onSaveEstoque()"
        (discard)="onDiscardEstoque()"
      ></app-estoque-panel>
 
      <app-expedicao-panel
        [positions]="expedicaoPositions()"
        (refresh)="refreshExpedicao()">
      </app-expedicao-panel>
 
    </div>
 
  </main>
 
  <app-footer></app-footer>
 
</div>


<app-cell-detail-model
    [opened]="modalOpen()"
    [position]="selectedPosition()"
    (close)="closeCellModal()">
</app-cell-detail-model>
