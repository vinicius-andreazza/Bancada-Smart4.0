<div class="bg-bg-card border border-border-subtle rounded-smart overflow-hidden w-full max-w-[420px] mx-auto">

    <div class="flex items-center justify-between px-5 py-[0.9rem] border-b border-border-subtle gap-3 w-full">

        <div class="font-heading text-base font-semibold tracking-[0.06em] flex items-center gap-2">
            Expedição
        </div>

        <button
            class="flex items-center justify-center w-8 h-8 rounded-lg text-gray-500
                 hover:text-gray-300 hover:bg-gray-800 transition-colors duration-150
                 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
            (click)="refresh.emit()">

            <i class="fa-solid fa-arrows-rotate"></i>

        </button>

    </div>

    <div class="p-5 overflow-x-auto">

        <div class="grid grid-cols-4 gap-2">

            @for (pos of positions(); track pos.posicao) {

                <div
                    class="rounded-lg border border-border-subtle bg-bg-surface px-[0.6rem] py-3
           flex flex-col items-center justify-center gap-1 transition-all duration-300 aspect-square"
                    [class.aguardando]="!!pos?.pedido?.codPedido"
                    [class.vazio]="!pos.pedido?.codPedido">

                    <div class="font-mono text-[0.6rem] text-text-muted tracking-[0.06em]">
                        POS {{ pos.posicao }}
                    </div>

                    <div class="font-mono text-[0.7rem] font-bold text-text-primary text-center">
                        {{ pos.pedido?.codPedido ?? '—' }}
                    </div>

                    <div class="font-body text-[0.6rem] font-semibold tracking-[0.06em] uppercase text-center">

                        {{ pos.pedido?.codPedido
                            ? 'AGUARDANDO RETIRADA'
                            : '' }}

                    </div>

                </div>

            }

        </div>

    </div>

</div>
