
<div class="relative flex items-center h-full w-full">

  <div
    class="absolute bottom-0 inset-x-0 h-px pointer-events-none
           bg-linear-to-r from-transparent via-accent/25 to-transparent"
    aria-hidden="true"
  ></div>

  <div class="flex items-center w-full mx-auto px-7 h-full">

    <a
      class="group inline-flex items-center gap-3 px-2 py-1.5 rounded-md no-underline
             transition-colors duration-200 hover:bg-panel mr-auto shrink-0
             focus-visible:outline focus-visible:outline-accent focus-visible:outline-offset-2"
      routerLink="/dashboard"
      aria-label="Planta SMART 4.0 – Exxer, voltar ao Dashboard"
    >
      <span
        class="flex items-center shrink-0"
        style="filter: drop-shadow(0 0 8px rgba(91,192,248,0.5));"
        aria-hidden="true"
      >
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon
            points="17,2 30,9.5 30,24.5 17,32 4,24.5 4,9.5"
            stroke="#5bc0f8" stroke-width="1.5" fill="none"
          />
          <polygon
            points="17,9 24,13 24,21 17,25 10,21 10,13"
            stroke="#5bc0f8" stroke-width="1" fill="#06090f" opacity="0.7"
          />
          <circle cx="17" cy="17" r="3.5" fill="#5bc0f8" />
          <circle cx="17" cy="17" r="3.5" fill="#5bc0f8" opacity="0.4">
            <animate attributeName="r"       values="3.5;5.5;3.5" dur="3s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.4;0;0.4"   dur="3s" repeatCount="indefinite" />
          </circle>
        </svg>
      </span>

      <span class="flex flex-col leading-none gap-px">
        <span class="font-mono-tech text-[0.6rem] tracking-[0.2em] text-muted">PLANTA</span>
        <span class="font-rajdhani text-lg font-bold tracking-wider text-bright">
          SMART&nbsp;<span class="text-accent">4.0</span>
        </span>
      </span>

      <span class="font-mono-tech text-sm text-rule mx-0.5 select-none" aria-hidden="true">//</span>
    </a>

    

    @if (!minimal()) {
      <nav class="flex items-center h-full ml-10" aria-label="Navegação principal">
        <ul class="flex items-center h-full gap-1 list-none m-0 p-0" role="list">
          @for (item of navItems; track item.route) {
            <li class="flex items-center h-full">
              <app-nav-link
                [label]="item.label"
                [route]="item.route"
                [ariaLabel]="item.ariaLabel"
              />
            </li>
          }
        </ul>
      </nav>
    }

    <div class="ml-5 shrink-0">
      <app-status-badge [status]="systemStatus()" />
    </div>

  </div>
</div>
