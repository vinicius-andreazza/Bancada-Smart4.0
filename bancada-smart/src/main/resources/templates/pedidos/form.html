<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Pedido</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .field {
            flex: 1;
            min-width: 220px;
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        input,
        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .bloco {
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }

        .bloco h3 {
            margin-bottom: 15px;
        }

        .lamina {
            border: 1px dashed #bbb;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }

        .btn {
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .actions {
            margin-top: 15px;
        }

        pre {
            background: #1f2937;
            color: white;
            padding: 15px;
            border-radius: 10px;
            overflow: auto;
            margin-top: 20px;
        }

        .hidden {
            display: none;
        }

    </style>
</head>
<body>

<div class="container">

    <h1>Novo Pedido</h1>

    <form id="pedidoForm">

        <div class="card">

            <div class="row">

                <div class="field">
                    <label>Código do Pedido</label>
                    <input type="text" id="codPedido" value="OP-2026-003">
                </div>

                <div class="field">
                    <label>Status</label>
                    <select id="status">
                        <option value="1">Pendente</option>
                        <option value="2" selected>Em Produção</option>
                        <option value="3">Finalizado</option>
                    </select>
                </div>

            </div>

            <div class="row">

                <div class="field">
                    <label>Tipo do Pedido</label>
                    <select id="tipoPedido">
                        <option value="1">SIMPLES</option>
                        <option value="2">DUPLO</option>
                        <option value="3" selected>TRIPLO</option>
                    </select>
                </div>

                <div class="field">
                    <label>Cor da Tampa</label>
                    <select id="corTampa">
                      <option value="1">Preto</option>
                      <option value="2">Vermelho</option>
                      <option value="3">Azul</option>
                    </select>
                </div>

                <div class="field">
                    <label>IP do CLP</label>
                    <input type="text" id="clpIp" value="10.74.241.11">
                </div>

            </div>

        </div>

        <div class="card">
            <h2>Blocos</h2>
            <div id="blocosContainer"></div>
        </div>

        <button type="submit" class="btn btn-primary">
            Gerar JSON
        </button>

        <button type="button" class="btn btn-primary" onclick="createPedido()">
          Enviar pedido
      </button>

    </form>

    <pre id="jsonOutput"></pre>

</div>

<script>
let pedidoArmazenado = null;
const blocosContainer = document.getElementById("blocosContainer");
const tipoPedido = document.getElementById("tipoPedido");

tipoPedido.addEventListener("change", renderBlocos);

function renderBlocos() {

    const totalBlocos = Number(tipoPedido.value);

    blocosContainer.innerHTML = "";

    for (let i = 0; i < totalBlocos; i++) {

        const bloco = document.createElement("div");
        bloco.className = "bloco";

        bloco.innerHTML = `
            <h3>Bloco ${i + 1}</h3>

            <div class="row">

                <div class="field">
                    <label>Andar</label>
                    <input type="text" class="andar" value="${i + 1}">
                </div>

                <div class="field">
                    <label>Cor do Bloco</label>
                    <select class="vl_cor">
                        <option value="1">Preto</option>
                        <option value="2">Vermelho</option>
                        <option value="3">Azul</option>
                    </select>
                </div>

                <div class="field">
                    <label>Posição Estoque</label>
                    <input type="text" class="posEstoque">
                </div>

            </div>

            <div class="laminas"></div>

            <div class="actions">
                <button type="button" class="btn btn-success add-lamina">
                    Adicionar Lâmina
                </button>
            </div>
        `;

        const laminasContainer = bloco.querySelector(".laminas");

        bloco.querySelector(".add-lamina").addEventListener("click", () => {

            const totalLaminas =
                laminasContainer.querySelectorAll(".lamina").length;

            if (totalLaminas >= 3) {
                alert("Máximo de 3 lâminas por bloco.");
                return;
            }

            const lamina = document.createElement("div");
            lamina.className = "lamina";

            lamina.innerHTML = `
                <div class="row">

                    <div class="field">
                        <label>Cor da Lâmina</label>
                        <select class="corLamina">
                          <option value="1">Vermelho</option>
                          <option value="2">Azul</option>
                          <option value="3">Amarelo</option>
                          <option value="4">Verde</option>
                          <option value="5">Preto</option>
                          <option value="6">Branco</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Padrão</label>
                        <select class="padraoLamina">
                            <option value="0">Nenhum</option>
                            <option value="1">Casa</option>
                            <option value="2">Navio</option>
                            <option value="3">Estrela</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Posição</label>
                        <select class="posicaoLamina">
                            <option value="1">Esquerda</option>
                            <option value="2">Frente</option>
                            <option value="3">Direita</option>
                        </select>
                    </div>

                </div>

                <button type="button" class="btn btn-danger remover-lamina">
                    Remover
                </button>
            `;

            lamina.querySelector(".remover-lamina")
                .addEventListener("click", () => {
                    lamina.remove();
                });

            laminasContainer.appendChild(lamina);

        });

        blocosContainer.appendChild(bloco);
    }
}

renderBlocos();

document.getElementById("pedidoForm")
.addEventListener("submit", function(e){

    e.preventDefault();
    criarJSON()
        

});

function criarJSON()
{


const pedido = {
    codPedido: document.getElementById("codPedido").value,
    status: Number(document.getElementById("status").value),
    tipoPedido: Number(document.getElementById("tipoPedido").value),
    corTampa: Number(document.getElementById("corTampa").value),
    clpIp: document.getElementById("clpIp").value,
    blocos: []
};

document.querySelectorAll(".bloco")
    .forEach(blocoElement => {

        const bloco = {
            andar: blocoElement.querySelector(".andar").value,
            vl_cor: blocoElement.querySelector(".vl_cor").value,
            posEstoque:
                blocoElement.querySelector(".posEstoque").value || null,
            laminas: []
        };

        blocoElement
            .querySelectorAll(".lamina")
            .forEach((laminaElement, index) => {

                bloco.laminas.push({
                    corLamina: Number(
                        laminaElement.querySelector(".corLamina").value
                    ),
                    padraoLamina: Number(
                        laminaElement.querySelector(".padraoLamina").value
                    ),
                    posicaoLamina: Number(
                        laminaElement.querySelector(".posicaoLamina").value
                    )
                });

            });

        pedido.blocos.push(bloco);

    });
    pedidoArmazenado = pedido;
document.getElementById("jsonOutput").textContent =
    JSON.stringify(pedido, null, 2);
    
}
const API_URL = "http://localhost:8088/api/pedidos";
async function createPedido() {
  criarJSON();
  pedido = pedidoArmazenado;
  console.log(pedido)
    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(pedido)
        });

        if (!response.ok) {
            throw new Error(`Erro ${response.status}`);
        }

        const data = await response.json();

        console.log("Pedido criado:", data);

        return data;

    } catch (error) {
        console.error("Erro ao criar pedido:", error);
        throw error;
    }
}
</script>

</body>
</html>
