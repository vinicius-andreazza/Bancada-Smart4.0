<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--/* ====================================================
   Fragment: head.html
   Usage: <head th:replace="~{fragments/head :: head(title='...')}"></head>
   ==================================================== */-->

<head th:fragment="head(title)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="SMART 4.0 – Sistema de Gerenciamento de Planta Industrial"/>
  <meta name="_csrf" th:content="${_csrf?.token}"/>
  <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>

  <title th:text="${title} + ' | SMART 4.0'">SMART 4.0</title>


  <!-- Bootstrap 5.3 -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"/>

  <!-- Font Awesome 6 -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous"/>

  <!-- App Styles -->
  <link rel="stylesheet" th:href="@{/css/smart-factory.css}"/>

  <!-- Thymeleaf CSRF for fetch() calls -->
  <script th:inline="javascript">
    window.SMART_CONFIG = {
      csrfToken:  /*[[${_csrf?.token}]]*/ '',
      csrfHeader: /*[[${_csrf?.headerName}]]*/ 'X-CSRF-TOKEN',
      refreshInterval: 15000
    };
  </script>
</head>
</html>
